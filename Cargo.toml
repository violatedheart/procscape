[package]
name = "procscape"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A living Linux process word-cloud wallpaper"
license = "MIT"

[features]
default = []
gui = ["dep:gtk4"]

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
gtk4 = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "procscape"
path = "src/main.rs"

[[bin]]
name = "procscape-gui"
path = "src/gui.rs"
required-features = ["gui"]
